tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Authentication a user by email and password'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            example: 'test@example.com'
          password:
            type: string
            example: 'password123'
responses:
  '200':
    description: 'Login successful'
    content:
      application/json:
        schema:
          type: object
          $ref: ../../components/schemas/session.yaml
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in a user!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: 'JWT access token'
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
