tags:
  - Auth
summary: 'Send reset password email'
operationId: sendResetEmail
description: 'Sending an email for a password resetting'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            example: 'test@example.com'
responses:
  '200':
    description: 'Reset email sent'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
            data:
              type: object
  '400':
    $ref: ../../components/responses/400-body.yaml
  '404':
    $ref: ../../components/responses/404.yaml
  '500':
    $ref: ../../components/responses/500.yaml
