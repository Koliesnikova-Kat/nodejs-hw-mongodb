tags:
  - Auth
summary: 'Verify user email'
operationId: verifyUserEmail
description: 'Verifying users email with a token from the email'
security: []
parameters:
  - in: query
    name: token
    required: true
    schema:
      type: string
    description: 'JWT verification token'
responses:
  '200':
    description: 'Email verified'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Email verified!'
            data:
              type: object
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
