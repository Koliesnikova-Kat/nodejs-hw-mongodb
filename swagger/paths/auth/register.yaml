tags:
  - Auth
summary: Authorize
operationId: registerUser
description: 'Registration a new user'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'test@example.com'
          password:
            description: "Users's password"
            type: string
            example: 'password123'
responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a new user!
            data:
              type: object
              $ref: ../../components/schemas/user.yaml
  '400':
    $ref: ../../components/responses/400-general.yaml
  '409':
    description: 'Email is already in use by another user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: ConflictError
            data:
              type: object
              properties:
                message:
                  type: string
                  example: Email in use
  '500':
    $ref: ../../components/responses/500.yaml
