tags:
  - Auth
summary: 'Confirm Google OAuth'
operationId: confirmOAuth
description: 'Handles the OAuth code returned by Google, and performs user login or registration.'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: string
            example: '4/oAEw…2q'
        required:
          - code
responses:
  '200':
    description: 'Google OAuth success'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Google OAuth login success!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
  '400':
    $ref: ../../components/responses/400-body.yaml
  '500':
    $ref: ../../components/responses/500.yaml
