tags:
  - Contacts
summary: Change contact's information by id
operationId: patchContact
description: 'With this operation you can change some of the contact`s fields or all the contact from the list by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: New name
            example: John Doe
          phoneNumber:
            type: string
            description: New phone number
            example: +380500000001
          email:
            type: string
            description: New email address
            example: 'test@example.com'
          contactType:
            type: string
            enum: [personal, home, work]
          isFavourite:
            type: boolean
          photo:
            type: string
            format: binary
responses:
  '200':
    description: 'Change contact`s info'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully changed a contact with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    description: 'Invalid request (body or ID)'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Bad Request'
            data:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid ID format or missing required field'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
