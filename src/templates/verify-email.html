<!DOCTYPE html>
<html lang="en" style="font-family: Arial, sans-serif; background-color: #f4f4f4;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify Your Email</title>
  </head>
  <body style="max-width: 600px; margin: 40px auto; padding: 20px; background-color: #ffffff; border-radius: 8px;">
    <h2 style="color: #2c3e50;">Welcome, {{name}} 👋</h2>
    <p>Thanks for registering! Click the button below to verify your email address:</p>
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{link}}" style="background-color: #27ae60; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">
        Verify Email
      </a>
    </div>
    <p>If you did not create an account, you can ignore this email.</p>
    <hr />
    <p style="font-size: 12px; color: #888;">This link will expire in 5 minutes.</p>
  </body>
</html>
